# docker-compose.yml
# Прямая репликация PostgreSQL: pg-master + pg-replica
# Мастер: localhost:5435 → pg-master:5432
# Реплика: localhost:5436 → pg-replica:5432

services:
  pg-master:
    image: postgres:${POSTGRES_VERSION}
    container_name: pg-master
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - ./payment_reply/master/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./payment_reply/master/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./payment_reply/master/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh
      - pg_master_data:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "${PG_MASTER_PORT}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pg-replica:
    image: postgres:${POSTGRES_VERSION}
    container_name: pg-replica
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - ./payment_reply/replica/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./payment_reply/replica/init-replica.sh:/init-replica.sh
      - pg_replica_data:/var/lib/postgresql/data
    ports:
      - "${PG_REPLICA_PORT}:5432"
    depends_on:
      pg-master:
        condition: service_healthy
    command: >
      bash -c "
        chmod +x /init-replica.sh &&
        /init-replica.sh
      "
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth
    ports:
      - "8001:8001"
    env_file:
      - .env
      - ./auth/.env
    depends_on:
      pg-master:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    container_name: users
    ports:
      - "8000:8000"
    env_file:
      - .env
      - ./users/.env
    depends_on:
      pg-master:
        condition: service_healthy
      pg-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - backend

  webhook_2can:
    build:
      context: ./webhook_2can
      dockerfile: Dockerfile
    container_name: webhook_2can
    ports:
      - "8002:8002"
    env_file:
      - .env
      - ./webhook_2can/.env
    depends_on:
      pg-master:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - backend

  alpha_hook:
    build:
      context: ./alpha_hook
      dockerfile: Dockerfile
    container_name: alpha_hook
    restart: unless-stopped
    depends_on:
      pg-master:
        condition: service_healthy
      pg-replica:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    env_file:
      - .env
      - ./alpha_hook/.env
    environment:
      # Явно указываем хосты (они не в .env)
      - POSTGRES_HOST=pg-master
      - POSTGRES_REPLICA_HOST=pg-replica
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    ports:
      - "8003:8000" # Только для локальной разработки!

    volumes:
      - ./alpha_hook/logs:/app/logs
      - ./alpha_hook/certs:/app/certs:ro
      - ./alpha_hook/.env:/app/.env:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/webhook/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  contracts:
    build:
      context: ./contracts
      dockerfile: Dockerfile
    container_name: contracts
    ports:
      - "8004:8004"
    env_file:
      - .env
      - ./contracts/.env
    depends_on:
      pg-master:
        condition: service_healthy
      pg-replica:
        condition: service_healthy
    networks:
      - backend

volumes:
  pg_master_data:
  pg_replica_data:

networks:
  backend:
    driver: bridge
