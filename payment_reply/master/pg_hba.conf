# Разрешить репликацию с любого хоста в Docker-сети (без SSL)
host replication replicator 0.0.0.0/0 md5

# Или ещё строже — только из подсети Docker (например, 172.18.0.0/16)
# host replication replicator 172.18.0.0/16 md5

# Или ещё проще — разрешить все IPv4-подключения с паролем:
host all all 0.0.0.0/0 md5

# Разрешить локальные подключения (по умолчанию)
local all all trust
host all all 127.0.0.1/32 trust
host all all ::1/128 trust